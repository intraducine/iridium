			<key>shellScript</key>
			<string># Licence texts bundled with the converter must match their sources (staged by
# build/madeira-d3d12/fetch-converter.sh); stale copies fail the build.
for pair in COPYING:LICENSE-MADEIRA-GPL-3.0.txt LICENSE-EXCEPTION.md:LICENSE-MADEIRA-EXCEPTION.txt; do
  src="$SRCROOT/../${pair%%:*}"; dst="$CODESIGNING_FOLDER_PATH/licenses/${pair##*:}"
  if [ ! -f "$dst" ] || ! cmp -s "$src" "$dst"; then echo "error: bundled ${pair##*:} is missing or stale; run build/stage-licenses.sh"; exit 1; fi
done
# A loose dylib copied as a resource is sealed by the bundle
# signature but is not itself re-signed, and dyld will not load code
# whose own signature does not match. Sign it with whatever identity
# this configuration resolved to, rather than hardcoding one.
DYLIB="$CODESIGNING_FOLDER_PATH/d3d12/libmetalirconverter.dylib"
[ -f "$DYLIB" ] || exit 0
if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ] &amp;&amp; [ "$CODE_SIGNING_ALLOWED" != "NO" ]; then
  codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$DYLIB"
else
  codesign --force --sign - "$DYLIB"
fi
