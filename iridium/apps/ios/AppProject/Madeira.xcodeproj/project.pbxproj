			<string>set -e
[ "$PLATFORM_NAME" = iphoneos ] || exit 0
# Madeira.app/Frameworks, which the JIT helper (PlugIns/MadeiraJITHelper.appex) loads
# through @executable_path/../../Frameworks: sideloaders re-sign the app's own
# Frameworks folder, and left an ad-hoc framework inside the helper unsigned.
SRC="$SRCROOT/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework"
DST="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/StikJIT.framework"
rm -rf "$DST"
mkdir -p "$(dirname "$DST")"
ditto "$SRC" "$DST"
# The framework ships without an Info.plist, which an app's embedded framework needs.
if [ ! -f "$DST/Info.plist" ]; then
  P="$DST/Info.plist"
  /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string StikJIT' -c "Add :CFBundleIdentifier string $PRODUCT_BUNDLE_IDENTIFIER.StikJIT" -c 'Add :CFBundleName string StikJIT' -c 'Add :CFBundlePackageType string FMWK' -c 'Add :CFBundleInfoDictionaryVersion string 6.0' -c 'Add :CFBundleShortVersionString string 1.0' -c 'Add :CFBundleVersion string 1' -c 'Add :CFBundleSupportedPlatforms array' -c 'Add :CFBundleSupportedPlatforms:0 string iPhoneOS' -c 'Add :MinimumOSVersion string 26.0' "$P" &gt;/dev/null
  plutil -convert binary1 "$P"
fi
if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ] &amp;&amp; [ "$CODE_SIGNING_ALLOWED" != "NO" ]; then
  codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$DST"
fi
