name: FEX memory workspace
on:
  push:
    branches: [work/fex-memory-regression-20260916]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          submodules: false
          lfs: false
      - name: Apply reviewed runtime changes without publishing workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import gzip, hashlib, json, os, pathlib, subprocess
          data = b''.join(pathlib.Path(f'.github/fex-review/part-{i}').read_bytes() for i in range(4))
          raw = gzip.decompress(data)
          assert hashlib.sha256(raw).hexdigest() == 'd1c6658beb4cd077222fa78c5f4e9da981fd6816d9478f1021c56d512ffff53c'
          bundle = json.loads(raw)
          assert bundle['base'] == '469b19451dad445d1a7640ec2ffd0b9bf9daa069'
          test_source = pathlib.Path('.github/fex-review/test_wine_thread_init.py').read_text()
          run = lambda args: subprocess.run(args, check=True)
          run(['git','fetch','--depth=1','origin',bundle['base']])
          run(['git','checkout','--detach',bundle['base']])
          report = pathlib.Path(os.environ['RUNNER_TEMP'])/'fex-validation'
          report.mkdir(exist_ok=True)
          commits = []
          for index, change in enumerate(bundle['commits']):
              patch = report/f'fix-{index}.patch'
              patch.write_text(change['patch'])
              run(['git','apply','--check',str(patch)])
              run(['git','apply','--index',str(patch)])
              run(['git','diff','--cached','--check'])
              run(['git','commit','-m',change['message']])
              commits.append(subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          for path, expected in bundle['files'].items():
              actual = subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual == expected, (path,expected,actual)
          # GITHUB_TOKEN cannot publish workflow changes. Keep that reviewed
          # update for the authorized connector to commit separately.
          workflow = '.github/workflows/source-checks.yml'
          (report/'source-checks.yml').write_text(pathlib.Path(workflow).read_text())
          run(['git','restore','--source='+bundle['base'],'--staged','--worktree',workflow])
          run(['git','commit','--amend','--no-edit'])
          commits[-1] = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          loader = pathlib.Path('testrepos/Madeira/wine/dlls/ntdll/loader.c')
          source = loader.read_text()
          old = '#ifdef __arm64ec__\n        arm64ec_thread_init();\n#endif'
          new = '''#ifdef __arm64ec__
                  if ((status = arm64ec_thread_init()) != STATUS_SUCCESS)
                  {
                      ERR( "ARM64EC thread initialization failed, status %#lx\\n", status );
                      RtlLeaveCriticalSection( &loader_section );
                      NtTerminateThread( GetCurrentThread(), status );
                      return;
                  }
          #endif'''
          # Remove YAML/Python display indentation from the source fragment.
          new = '\n'.join(line[8:] if line.startswith('        ') else line for line in new.splitlines())
          assert source.count(old) == 1
          loader.write_text(source.replace(old,new))
          pathlib.Path('ci/test_wine_thread_init.py').write_text(test_source)
          doc = pathlib.Path('docs/decisions/2026-09-fex-thread-arena.md')
          doc.write_text(doc.read_text() + '\n## Wine caller propagation\n\nWine loader_init previously ignored arm64ec_thread_init() status. It now\nreleases the loader critical section and terminates the failed thread before\nTLS attachment or guest callbacks. A scoped executable C test checks the actual\nproduction guard with both failure statuses and success; OS calls are stubbed.\n')
          run(['git','add',str(loader),'ci/test_wine_thread_init.py',str(doc)])
          run(['git','diff','--cached','--check'])
          run(['git','commit','-m','Stop Wine thread attachment when FEX initialization fails'])
          commits.append(subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          assert not subprocess.check_output(['git','diff',bundle['base'],'HEAD','--','.github/workflows'])
          files = dict(bundle['files'])
          for path in (str(loader),'ci/test_wine_thread_init.py',str(doc)):
              files[path] = subprocess.check_output(['git','hash-object',path],text=True).strip()
          (report/'commits.json').write_text(json.dumps({'base':bundle['base'],'commits':commits,'files':files},indent=2)+'\n')
          print('Reviewed code-only candidate commits:', *commits)
          PY
      - name: Prepare pinned allocator input
        run: |
          git submodule update --init --depth 1 -- testrepos/Madeira/FEX/External/rpmalloc
          python3 ci/apply-rpmalloc-patches.py
      - name: Run complete source checks and executable regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 check-public-source.py
          python3 ci/check-standards.py
          for test in TouchControllerCheck HostArenaCheck LiveContainerStartupJITCheck StartupJITStatusCheck LibraryStatusCheck; do
            python3 "iridium/apps/ios/MadeiraSupportTests/$test.py"
          done
          python3 -B -m unittest discover -s ci -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/fex-validation/tests.txt"
      - name: Publish only the validated code candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/work/fex-memory-validated-20260916
      - name: Retain validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fex-memory-validation
          path: ${{ runner.temp }}/fex-validation/
          if-no-files-found: warn
          retention-days: 3
