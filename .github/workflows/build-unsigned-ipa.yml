name: Build sideloading IPA
run-name: Manual sideloading IPA · ${{ github.ref_name }} · ${{ inputs.dispatch_id }}
"on":
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Required full commit SHA to build
        required: true
        type: string
      dispatch_id:
        description: Optional identifier supplied by ci/dispatch-build.py
        required: false
        type: string
      reuse_assets:
        description: Reuse matching completed Madeira component builds
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify requested commit before building
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 ci/dispatch-build.py --check
      - name: Initialize the pinned runtime sources
        run: |
          git submodule update --init --depth 1 vendor/Madeira vendor/SameBoy vendor/PPSSPP
          python3 ci/build-ppsspp.py --initialize
          git -C vendor/Madeira submodule update --init --depth 1 FEX wine dxmt madeira-dock
          git -C vendor/Madeira/FEX submodule update --init --depth 1 External/fmt External/range-v3 External/rpmalloc External/unordered_dense External/vixl External/xxhash Source/Common/cpp-optparse
          git -C vendor/Madeira/dxmt submodule update --init --recursive --depth 1
      - name: Check source privacy and standards
        run: |
          python3 check-public-source.py
          python3 ci/check-standards.py
          python3 -B -m unittest discover -s ci -p 'test_*.py'
      - name: Prepare Apple Silicon build tools
        run: |
          python3 ci/local_build_tools.py --madeira --write-env .build/madeira-build-tools.env
          source .build/madeira-build-tools.env
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          # Actions prepends each entry, so write least-preferred paths first.
          python3 -c 'import os; print("\n".join(reversed(os.environ["PATH"].split(os.pathsep))))' >> "$GITHUB_PATH"
          python3 ci/madeira-frontend.py toolchains
          python3 ci/compiled-components.py madeira-toolchain
      - name: Verify inherited build tools
        run: |
          for tool in bison python3 clang clang++ aarch64-w64-mingw32-clang arm64ec-w64-mingw32-clang x86_64-w64-mingw32-clang i686-w64-mingw32-clang; do
            inherited=$(command -v "$tool")
            prepared=$(source .build/madeira-build-tools.env; command -v "$tool")
            if [ "$inherited" != "$prepared" ]; then
              echo "::error::Prepared build tool was shadowed: $tool"
              exit 1
            fi
            "$tool" --version
          done
      - name: Select completed native compilation
        id: compiled_madeira_native
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_ASSETS: ${{ inputs.reuse_assets }}
        run: python3 ci/compiled-components.py select madeira-native
      - name: Download native compilation
        if: steps.compiled_madeira_native.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7.0.1
        with:
          name: ${{ steps.compiled_madeira_native.outputs.artifact }}
          run-id: ${{ steps.compiled_madeira_native.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .build/madeira-native-compiled-transfer
      - name: Restore native compilation
        if: steps.compiled_madeira_native.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT_RUN_ID: ${{ steps.compiled_madeira_native.outputs.run_id }}
        run: python3 ci/compiled-components.py restore madeira-native
      - name: Compile madeira-native
        run: python3 ci/madeira-frontend.py native
      - name: Package native compilation
        if: steps.compiled_madeira_native.outputs.run_id == ''
        run: python3 ci/compiled-components.py package madeira-native
      - name: Retain madeira-native compilation
        if: steps.compiled_madeira_native.outputs.run_id == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.compiled_madeira_native.outputs.artifact }}
          path: .build/madeira-native-compiled-transfer/
          if-no-files-found: error
          retention-days: 14
      - name: Select completed i386 compilation
        id: compiled_madeira_windows
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_ASSETS: ${{ inputs.reuse_assets }}
        run: python3 ci/compiled-components.py select madeira-windows
      - name: Download i386 compilation
        if: steps.compiled_madeira_windows.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7.0.1
        with:
          name: ${{ steps.compiled_madeira_windows.outputs.artifact }}
          run-id: ${{ steps.compiled_madeira_windows.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .build/madeira-windows-compiled-transfer
      - name: Restore i386 compilation
        if: steps.compiled_madeira_windows.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT_RUN_ID: ${{ steps.compiled_madeira_windows.outputs.run_id }}
        run: python3 ci/compiled-components.py restore madeira-windows
      - name: Compile madeira-windows
        run: python3 ci/madeira-frontend.py windows
      - name: Package i386 compilation
        if: steps.compiled_madeira_windows.outputs.run_id == ''
        run: python3 ci/compiled-components.py package madeira-windows
      - name: Retain madeira-windows compilation
        if: steps.compiled_madeira_windows.outputs.run_id == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.compiled_madeira_windows.outputs.artifact }}
          path: .build/madeira-windows-compiled-transfer/
          if-no-files-found: error
          retention-days: 14
      - name: Check build prerequisites
        run: python3 ci/check-ipa-prerequisites.py --profile madeira-frontend
      - name: Build without signing
        id: app_build
        env:
          IRIDIUM_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: python3 ci/madeira-frontend.py app
      - name: Record app binaries for final audit
        run: python3 ci/collect-app-link-audit.py .build/madeira-frontend-derived/Build/Products/Debug-iphoneos/Iridium.app .build/app-link-audit/binaries.json --link-maps .build/madeira-frontend-derived/Build/Intermediates.noindex
      - name: Retain app link maps for final audit
        if: always() && steps.app_build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Iridium-link-audit-${{ github.sha }}
          path: |
            .build/madeira-frontend-derived/**/*LinkMap*.txt
            .build/app-link-audit/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Collect matching source and component records
        run: python3 ci/collect-madeira-source.py .build/madeira-frontend-derived/Build/Products/Debug-iphoneos/Iridium.app .build/ipa-output --link-maps .build/madeira-frontend-derived/Build/Intermediates.noindex
      - name: Retain source archive for release audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Iridium-source-${{ github.sha }}
          path: |
            .build/ipa-output/Iridium-corresponding-source.tar.gz
            .build/ipa-output/SOURCE-SHA256SUMS
            .build/ipa-output/COMPONENT-MANIFEST.json
          if-no-files-found: error
          retention-days: 14
      - name: Check final binary audit before packaging
        run: python3 ci/check-ipa-prerequisites.py --profile madeira-frontend --package
      - name: Prepare and audit sideloading package
        run: python3 ci/package-unsigned-ipa.py .build/madeira-frontend-derived/Build/Products/Debug-iphoneos/Iridium.app .build/ipa-output
      - name: Upload sideloading IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Iridium-unsigned-${{ github.sha }}
          path: |
            .build/ipa-output/Iridium-unsigned.ipa
            .build/ipa-output/SHA256SUMS
            .build/ipa-output/ipa-signature-audit.json
          if-no-files-found: error
          retention-days: 14
