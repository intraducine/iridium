name: Dispatch hybrid e62 + 65b596 native build

on:
  push:
    branches:
      - test/hybrid-e62-native-65b596

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch unsigned IPA build without compiled-asset reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          gh workflow run build-unsigned-ipa.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f expected_sha="$EXPECTED_SHA" \
            -f dispatch_id="hybrid-native-65b596-$GITHUB_RUN_ID" \
            -f reuse_assets=false
