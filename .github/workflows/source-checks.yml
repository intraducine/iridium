name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 0
      - name: Reject private material and oversized files
        run: python3 check-public-source.py
      - name: Check repository standards
        run: python3 ci/check-standards.py
      - name: Check manual build safeguards
        run: python3 -B -m unittest discover -s ci -p 'test_*.py'
      - name: Prepare temporary source-only review checkout
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/review-safety-20260914'
        run: |
          mkdir -p "$RUNNER_TEMP/review-source"
          git bundle create "$RUNNER_TEMP/review-source/checkout.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/review-source/checkout.bundle"
          git rev-parse HEAD > "$RUNNER_TEMP/review-source/revision.txt"
      - name: Transfer temporary source-only review checkout
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/review-safety-20260914'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-source-checkout-${{ github.sha }}
          path: ${{ runner.temp }}/review-source/
          if-no-files-found: error
          retention-days: 1
