name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    # Host fixtures need Apple frameworks and the app build's Swift toolchain.
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Check out the pinned frontend and console sources
        run: git submodule update --init --depth 1 vendor/Madeira vendor/SameBoy vendor/PPSSPP
      - name: Verify host test tools
        run: |
          xcrun --find swiftc
          xcrun swiftc --version
          xcrun --find clang++
          command -v zstd || HOMEBREW_NO_AUTO_UPDATE=1 brew install zstd
      - name: Reject private material and oversized files
        run: python3 check-public-source.py
      - name: Check repository standards
        run: python3 ci/check-standards.py
      - name: Check touch controller wiring
        run: python3 iridium/apps/ios/MadeiraSupportTests/TouchControllerCheck.py
      - name: Check FEX arena reservation
        run: python3 iridium/apps/ios/MadeiraSupportTests/HostArenaCheck.py
      - name: Check LiveContainer startup JIT policy
        run: python3 iridium/apps/ios/MadeiraSupportTests/LiveContainerStartupJITCheck.py
      - name: Check startup JIT status reporting
        run: python3 iridium/apps/ios/MadeiraSupportTests/StartupJITStatusCheck.py
      - name: Check library status UI
        run: python3 iridium/apps/ios/MadeiraSupportTests/LibraryStatusCheck.py
      - name: Check imported Madeira runtime
        run: |
          for check in audio-wow64 audio-downmix d3d9-splitlock d9-upload-commit fastsync nsi-network readonly-link section-abort image-retire lazy-windows nav-keys swap-coverage unixlib-binder win32u-zero-bits wow-context wow-cpu-area wow-sweep filtering-cap scene-batching; do
            python3 "testrepos/Madeira/build/host-tests/check-$check.py"
          done
      - name: Check manual build safeguards
        run: python3 -B -m unittest discover -s ci -p 'test_*.py'
