name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Reject private material and oversized files
        run: python3 check-public-source.py
      - name: Check repository standards
        run: python3 ci/check-standards.py
      - name: Check touch controller wiring
        run: python3 iridium/apps/ios/MadeiraSupportTests/TouchControllerCheck.py
      - name: Check FEX arena reservation
        if: github.ref_name != 'test/native-65b596-hybrid'
        run: python3 iridium/apps/ios/MadeiraSupportTests/HostArenaCheck.py
      - name: Check diagnostic native baseline
        if: github.ref_name == 'test/native-65b596-hybrid'
        run: |
          grep -Fq 'DIAGNOSTIC 65b596 hybrid: no app reservation supplied' iridium/apps/ios/MadeiraSupport/NativePool.c
          grep -Fq 'skipping post-65b596 FEX/Wine correction patches' ci/prepare-runtime-inputs.sh
      - name: Check LiveContainer startup JIT policy
        run: python3 iridium/apps/ios/MadeiraSupportTests/LiveContainerStartupJITCheck.py
      - name: Check startup JIT status reporting
        run: python3 iridium/apps/ios/MadeiraSupportTests/StartupJITStatusCheck.py
      - name: Check library status UI
        run: python3 iridium/apps/ios/MadeiraSupportTests/LibraryStatusCheck.py
      - name: Check manual build safeguards
        run: python3 -B -m unittest discover -s ci -p 'test_*.py'
